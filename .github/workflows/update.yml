name: Update QQQ-TQQQ Quant Portfolio Dashboard

on:
  schedule:
    # 매일 미국 증시 마감 후 (화~토 한국시간 07:00 / UTC 22:00)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Quant Simulation & Build index.html
        run: |
          python build.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes in index.html to commit."
          else
            git commit -m "chore(auto): update portfolio balance dashboard [skip ci]"
            git push
          fi
